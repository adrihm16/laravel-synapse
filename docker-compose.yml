services:
  app:
    build: .
    ports:
      - "8080:8000"
    environment:
      APP_NAME: Synapse
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: synapse_db
      DB_USERNAME: synapse
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "true"
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      FILESYSTEM_DISK: local
      MAIL_MAILER: log
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage

  worker:
    build: .
    environment:
      APP_NAME: Synapse
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: synapse_db
      DB_USERNAME: synapse
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      LOG_CHANNEL: stack
      LOG_LEVEL: debug
      FILESYSTEM_DISK: local
    command: php artisan queue:listen --timeout=90 --tries=3
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage_data:/var/www/html/storage

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: synapse_db
      MYSQL_USER: synapse
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  storage_data:
